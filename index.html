<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UB">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f5d8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Unterrichtsbeobachtung</title>
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface2:#ecebe6; --text:#1c1c1a; --muted:#6a6964; --line:#d9d6ce;
  --accent:#2f5d8a; --accent-ink:#ffffff;
  --pos:#23724a; --pos-bg:#dff0e5; --neg:#b0452a; --neg-bg:#f9e2da; --warn:#9a6a0c; --warn-bg:#f8edd3;
  --neu:#3f5277; --neu-bg:#e3e9f3;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161614; --surface:#212120; --surface2:#2b2b29; --text:#ecebe6; --muted:#a3a19a; --line:#3a3936;
    --accent:#7eaedc; --accent-ink:#0f1c29;
    --pos:#7fd3a0; --pos-bg:#1d3a28; --neg:#f19a80; --neg-bg:#45241a; --warn:#e9c068; --warn-bg:#3e3116;
    --neu:#a9bde2; --neu-bg:#26314a;
  }
}
:root[data-theme="dark"]{
  --bg:#161614; --surface:#212120; --surface2:#2b2b29; --text:#ecebe6; --muted:#a3a19a; --line:#3a3936;
  --accent:#7eaedc; --accent-ink:#0f1c29;
  --pos:#7fd3a0; --pos-bg:#1d3a28; --neg:#f19a80; --neg-bg:#45241a; --warn:#e9c068; --warn-bg:#3e3116;
  --neu:#a9bde2; --neu-bg:#26314a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.45}
input[type=text],input[type=date],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
h1{font-size:24px;margin:0}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:60px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.title{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.timer{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 12px}
.timer .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:18px}
.timer .m{font-size:13px;color:var(--muted)}
.timer.over .t{color:var(--neg)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 16px 8px;max-width:1180px;margin:0 auto;scrollbar-width:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;color:var(--muted);white-space:nowrap;min-height:40px}
.tab.on{background:var(--text);color:var(--bg)}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:240px;display:none;z-index:30}
.menu.open .pop{display:block}
.pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:8px}
.pop button:hover{background:var(--surface2)}

main{padding:18px 0 140px}

/* list */
.grid-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.obs-card{cursor:pointer;display:flex;flex-direction:column;gap:4px}
.obs-card .n{font-weight:600;font-size:17px}
.empty{text-align:center;padding:60px 16px;color:var(--muted)}

/* kopf */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

/* verlauf */
.entry{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.entry input.min{text-align:center;padding:10px 4px;font-variant-numeric:tabular-nums;font-weight:600}
.entry textarea{min-height:44px}
.entry .meths{grid-column:2/3;display:flex;gap:6px;flex-wrap:wrap}
.entry .del{grid-row:1/3;grid-column:3}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.composer .wrap{display:flex;flex-direction:column;gap:8px}
.composer .line{display:flex;gap:8px}
.composer input{flex:1}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;min-height:38px;font-size:15px;color:var(--text);transition:background .12s}
.chip.sm{min-height:32px;padding:4px 10px;font-size:13px}
.chip.pos{border-color:color-mix(in srgb,var(--pos) 35%,var(--line))}
.chip.neg{border-color:color-mix(in srgb,var(--neg) 35%,var(--line))}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.chip.pos.on{background:var(--pos-bg);color:var(--pos);border-color:var(--pos);font-weight:600}
.chip.neg.on{background:var(--neg-bg);color:var(--neg);border-color:var(--neg);font-weight:600}
.chip.warn.on{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);font-weight:600}
.chip.neu.on{background:var(--neu-bg);color:var(--neu);border-color:var(--neu);font-weight:600}
.chip.on::before{content:"✓ "}

/* raster */
.raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:14px;align-items:start}
@media (max-width:520px){.raster{grid-template-columns:1fr}}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sec-head h2{margin:0;flex:1}
.badge{font-size:12px;border-radius:999px;padding:2px 8px;font-weight:600}
.badge.p{background:var(--pos-bg);color:var(--pos)}
.badge.n{background:var(--neg-bg);color:var(--neg)}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .lbl{font-size:14px;font-weight:600;margin-bottom:6px}
.sec-note{margin-top:10px}

/* tafel */
.sketch-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--accent)}
.canvas-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
canvas#sk{display:block;width:100%;aspect-ratio:16/10;touch-action:none;background:#fff}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.photo{position:relative}
.photo img{width:100%;border-radius:10px;display:block;border:1px solid var(--line)}
.photo button{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:999px;width:36px;height:36px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none!important}

/* Medien */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mcard{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.mcard img{width:100%;height:220px;object-fit:contain;background:var(--surface2);border-radius:8px;display:block}
.badge.k{background:var(--neu-bg);color:var(--neu)}

/* Scanner */
.scanner{position:fixed;inset:0;z-index:70;background:#111;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sc-top,.sc-bottom{display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.sc-bottom{justify-content:center}
.sc-title{flex:1;text-align:center;font-weight:600;min-width:0}
.sc-hint{color:#bbb;font-size:14px;flex-basis:100%;text-align:center}
.sc-stage{flex:1;position:relative;min-height:0}
.sc-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.scanner .btn{background:#2a2a2a;color:#fff;border-color:#444}
.scanner .btn.primary{background:#2f7de1;border-color:#2f7de1}
.scanner .chip{background:#2a2a2a;color:#fff;border-color:#555}
.scanner .chip.on{background:#fff;color:#111;border-color:#fff}
.scanner .chip.on::before{content:""}

/* ---------- PRINT / PDF ---------- */
#printArea{display:none;background:#fff;color:#000;font-size:10.5pt;line-height:1.35}
/* Offscreen-Rendering für PDF-Erzeugung: A4-Inhaltsbreite 186 mm ≈ 703 px */
#printArea.render{display:block;position:fixed;left:-10000px;top:0;width:703px}
#printArea.render .pp{padding-bottom:1px}
#printArea .pp{page-break-after:always;break-after:page}
#printArea .pp:last-child{page-break-after:auto;break-after:auto}
#printArea .ph{font-size:15pt;font-weight:700;margin:0 0 6pt}
#printArea .kopf{width:100%;border-collapse:collapse;margin-bottom:8pt}
#printArea .kopf td{border:1px solid #000;padding:4pt 6pt;vertical-align:top}
#printArea .kopf .k{font-size:8pt;color:#444;display:block}
#printArea table.vl{width:100%;border-collapse:collapse}
#printArea table.vl th,#printArea table.vl td{border:1px solid #000;padding:3pt 5pt;vertical-align:top;text-align:left}
#printArea table.vl th{background:#eee}
#printArea table.vl td.z{width:12mm;text-align:center}
#printArea table.vl td.s{width:42mm}
#printArea tr{break-inside:avoid}
#printArea .box{border:1px solid #000;min-height:230mm;padding:6pt}
#printArea .bl{white-space:pre-wrap;min-height:1.35em}
#printArea .rgrid{display:flex;gap:8mm;font-size:8.6pt;line-height:1.3;align-items:flex-start}
#printArea .rcol{flex:1;min-width:0}
#printArea .rsec{margin-bottom:6pt}
#printArea .rsec h4{font-size:10pt;margin:0 0 3pt;border-bottom:1.5px solid #000;padding-bottom:1pt}
#printArea .rgrp{font-weight:700;margin:4pt 0 1pt;font-style:italic}
#printArea .ritem{break-inside:avoid;margin-bottom:3pt}
#printArea .ritem .l{font-weight:600}
#printArea .rcols{display:grid;grid-template-columns:1fr 1fr;column-gap:4pt}
#printArea .rscale{display:flex;flex-wrap:wrap;gap:0 8pt}
#printArea .x{white-space:nowrap}
#printArea .x.on{font-weight:700}
#printArea .rnote{font-style:italic;margin-top:2pt;white-space:pre-wrap}
#printArea .timg{max-width:100%;max-height:115mm;display:block;margin:0 auto 6pt;border:1px solid #000}
#printArea .nb{margin-top:10pt;font-size:11pt}
#printArea .mitem{break-inside:avoid;margin-bottom:8pt}
#printArea table.la td.c,#printArea table.la th.c{width:20mm;text-align:center;font-size:12pt}
#printArea table.la th.c{font-size:9pt}
#printArea table.la{font-size:9pt}
#printArea table.la td{padding:2pt 5pt}
#printArea table.la tr.lag td{background:#eee;font-weight:700}
#printArea .mitem img{max-width:100%;display:block;margin:0 auto;border:1px solid #999}
#printArea .mitem img.photo{max-height:115mm}
#printArea .mitem img.scan{max-height:235mm}
#printArea .mcap{font-size:9pt;text-align:center;margin-top:2pt}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff;color:#000}
  #app,.toast,.modal{display:none!important}
  #printArea{display:block}
}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px}
.modal .btn{justify-content:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept="application/json,.json" class="hidden">
<input type="file" id="filePhoto" accept="image/*" capture="environment" class="hidden">
<input type="file" id="filePick" accept="image/*" multiple class="hidden">

<script>
"use strict";
/* ================= Checklisten-Definition (aus 0_UB-Vorlage.pdf) ================= */
// M = Mehrfachauswahl (pos | neg | neutral), S = Skala (Einzelauswahl, links = positiv)
// Ein "~" vor einer Option markiert sie als "mit Einschränkung" (gelb).
const M = (label, pos, neg, neu) => ({type:'m', label, pos:pos||[], neg:neg||[], neu:neu||[]});
const S = (label, opts) => ({type:'s', label, opts});
const F = ['immer','häufig','selten','nie'];
const RASTER = [
  {s:'Classroom-Management', g:[
    {t:'Arbeitsanweisungen', i:[
      M('Allgemein',['sinnvoll','zum Thema passend','auch schriftlich','verständlich','angemessene Zahl','mit Überprüfung'],['zu viele','zu wenige','unverständlich','unpräzise','nur mündlich','ohne Überprüfung']),
      S('Schüler wissen zu jeder Zeit, was zu tun ist',['ja','nein']),
      M('Niveau',['hoch','angemessen'],['niedrig','oberflächlich'])]},
    {t:'Gesprächsführung', i:[
      M('Allgemein',['zielgerichtet'],['„in die Runde“']),
      M('Fragetechnik',['Impulse/Operatoren','abwechslungsreich'],['zu viele W-Fragen','immer gleich']),
      M('Umgang mit Schüler-Fragen',['freundlich','kompetent','souverän','flexibel'],['inkompetent','unsicher','verliert Faden','unflexibel'])]},
    {t:'Sprache', i:[
      M('Allgemein',['klar','deutlich','laut','angemessenes Niveau'],['unklar','undeutlich','zu leise','Niveau zu gering']),
      M('Lehrervortrag',['spannend','informierend'],['langweilig','einschläfernd','redet zu viel']),
      M('Stimmführung',['temperamentvoll','Lautstärke variabel'],['monoton','eine Lautstärke'])]}
  ]},
  {s:'Arbeitsatmosphäre / Lernförderliches Verhalten', g:[
    {t:'', i:[
      M('Auftreten',['souverän','sicher','freundlich','humorvoll'],['nervös','unsicher','zu ernst','gehemmt']),
      S('Freundlicher Umgang',F), S('Ausreden lassen',F), S('Auflockernde Bemerkung',F),
      S('Ausreichend Zeit zum Nachdenken',F), S('Angemessenes Lob',F)]}
  ]},
  {s:'Didaktik / Methodik / Medien', g:[
    {t:'Stundenziele', i:[
      M('Allgemein',['sinnvoll','zum Thema passend','von Beginn an klar','angemessene Zahl'],['zu viele','zu wenige','fehlt zu Beginn','unpräzise']),
      M('Niveau',['hoch','angemessen'],['niedrig','oberflächlich']),
      M('Erreichen',['ausnahmslos sicher','sicher'],['~nur teilweise','nicht'])]},
    {t:'', i:[
      M('Didaktische Reduktion',['sehr gelungen','fehlerfrei'],['~mit leichten Mängeln','falsche Schwerpunkte']),
      M('Sachrichtigkeit',['absolut korrekt','~etwas unsauber'],['fehlerhaft','große Mängel']),
      M('Methodenwechsel',[],[],['GA','EA','PA','Stationen/StEx','frontal','Präsentation']),
      M('Medieneinsatz',[],[],['Tafel','Tablet','IWB','Text/Kopie','PC','Buch','Hörstück','Film','Realien','Experiment','Internetrecherche']),
      M('Arbeitsmaterialien / Mediengestaltung',['sehr anschaulich','gelungen','fehlerfrei','abwechslungsreich','altersangemessen'],['nicht vorhanden','mit Fehler','fachliche Fehler','zu umfangreich','überfordernd','unterfordernd']),
      M('Stundenaufbau',['logisch','sinnvoll eingeteilt','Vorwissen aktiviert','sinnvolle Übungen','aktivierende Infos','Auswertung / Ausblick / sinnvoller Abschluss'],['unlogisch','verwirrend','keine Anknüpfung','keine Vertiefung','keine Überleitungen'])]}
  ]},
  {s:'Schüleraktivierung / Stundenbilanz', g:[
    {t:'', i:[
      S('Schülerbeteiligung',['sehr häufig','häufig','selten','nie']),
      S('Konzentrierte Arbeitsatmosphäre',F),
      S('Lernzuwachs bei den Schülern',['sehr groß','groß','gering','kaum']),
      S('Die Schüler haben sich wertgeschätzt gefühlt.',['sehr','häufig','selten','nie']),
      S('Differenzierungen',['sehr gelungen','gelungen','m. Einschr.','keine']),
      S('Den Schülern ist klar, WARUM sie das Thema lernen.',['ganz deutlich','zum Teil','nein']),
      S('Die Schüler können das Gelernte anwenden.',['sehr häufig','häufig','selten','nie'])]}
  ]}
];
// Leistungsanforderungen für Lehrkräfte (Realschule, Stand 7. April 2021, gültig für Beurteilung 2026)
// 2.2.1.1 Unterrichtsplanung und Unterrichtsgestaltung (Stufentexte zu 2.2.1.1/2.2.1.2):
// Stufenbeschreibungen BG–MA, in einzelne prüfbare Aussagen zerlegt.
// neg: Stufe beschreibt Mängel – „ja“ bedeutet dort „Mangel trifft zu“ (rot).
const LA_TITLE = 'Unterrichtsplanung und Unterrichtsgestaltung (2.2.1.1)';
// Aussagen zu Leistungsnachweisen und zu Erfolgen sind bewusst entfernt; IDs bleiben stabil (gespeicherte Bewertungen).
const LA_GROUPS = [
  {k:'BG', items:[
    ['BG1', 'Der Unterricht ist in jeder Hinsicht besonders gut.'],
    ['BG2', 'Innovative Lehr- und Lernformen werden souverän beherrscht und angewendet.']]},
  {k:'UB', items:[
    ['UB1', 'Die Lehrkraft erteilt jederzeit einen abwechslungsreichen, innovativen Unterricht.'],
    ['UB2', 'Methodische und didaktische Aspekte werden stets berücksichtigt: Handlungsorientierung.'],
    ['UB3', 'Methodische und didaktische Aspekte werden stets berücksichtigt: fächerübergreifender Unterricht.'],
    ['UB4', 'Methodische und didaktische Aspekte werden stets berücksichtigt: Entwicklung von Fach-, Sozial- und Methodenkompetenzen.'],
    ['UB8', 'Hausaufgaben werden gezielt und umsichtig gestellt.'],
    ['UB9', 'Hausaufgaben werden für die Schülerinnen und Schüler individuell fördernd ausgewertet.'],
    ['UB10', 'Die Heftführung wird eingehend und vorbildlich überwacht.']]},
  {k:'VE', items:[
    ['VE1', 'Der Unterricht berücksichtigt die geforderten methodischen, didaktischen und fächerübergreifenden Aspekte.'],
    ['VE2', 'Der Unterricht enthält sehr häufig handlungsorientierte Bausteine.'],
    ['VE3', 'Die Lern- und Bildungsziele werden voll erreicht.'],
    ['VE4', 'Das Grundwissen wird dauerhaft gesichert.'],
    ['VE9', 'Die Hausaufgaben werden sinnvoll gestellt und umfassend ausgewertet.'],
    ['VE10', 'Hausaufgaben und Heftführung werden regelmäßig überwacht.']]},
  {k:'HM', items:[
    ['HM1', 'Der Unterricht ist fachgerecht.'],
    ['HM2', 'Unterschiedliche Lehr- und Lernformen werden berücksichtigt.'],
    ['HM4', 'Die Lerninhalte werden sinnvoll über das Schuljahr verteilt.'],
    ['HM6', 'Die Hausaufgaben werden angemessen besprochen.'],
    ['HM7', 'Hausaufgaben und Heftführung werden im Allgemeinen überwacht.']]},
  {k:'MA', neg:true, items:[
    ['MA1', 'Der Unterricht weist didaktische und methodische Schwächen auf.'],
    ['MA2', 'Die Lehrkraft ist bemüht.'],
    ['MA3', 'Die Intentionen des Lehrplans werden nur mit Einschränkungen erfüllt.'],
    ['MA5', 'Hausaufgaben und Heftführung werden nur sporadisch überwacht.']]}
];
// „Die Lehrkraft ist bemüht“ ist neutral formuliert, kein Mangel
const LA_NEUTRAL = new Set(['MA2']);
const LA_ITEMS = LA_GROUPS.flatMap(g => g.items.map(([id, t]) => ({id, t, g:g.k, neg:!!g.neg && !LA_NEUTRAL.has(id)})));
const LA_OPTS = [['ja', 'ja', 'pos'], ['nein', 'nein', 'neg'], ['nb', 'nicht beobachtet', 'neu']];
const METHODEN = ['LV','UG','EA','PA','GA','Stationen','Präsentation','Film/Audio','Experiment','Sicherung'];
const LESSON_MIN = 45;

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = o => o.replace(/^~/, '');
const isWarn = o => o.startsWith('~');
const itemKey = (sec, grp, it) => `${sec.s}|${grp.t}|${it.label}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => d ? d.split('-').reverse().join('.') : '';
function scaleClass(i, n){ if(n <= 1) return 'pos'; const r = i/(n-1); return r <= .34 ? 'pos' : r <= .67 ? 'warn' : 'neg'; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }

/* ================= Storage (IndexedDB, nur lokal) ================= */
const DB = {
  db: null, mem: new Map(),
  async open(){
    try{
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('ub-app', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('obs', {keyPath:'id'});
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    }catch(e){ this.db = null; console.warn('IndexedDB nicht verfügbar', e); }
  },
  tx(mode){ return this.db.transaction('obs', mode).objectStore('obs'); },
  async all(){
    if(!this.db) return [...this.mem.values()];
    return new Promise((res, rej) => { const r = this.tx('readonly').getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  async put(o){
    if(!this.db){ this.mem.set(o.id, o); return; }
    return new Promise((res, rej) => { const r = this.tx('readwrite').put(o); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
  },
  async del(id){
    if(!this.db){ this.mem.delete(id); return; }
    return new Promise((res, rej) => { const r = this.tx('readwrite').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
  }
};

/* ================= State ================= */
let list = [];          // alle Beobachtungen
let cur = null;         // aktuelle Beobachtung
let tab = 'kopf';
let currentMeths = [];  // Sozialform für nächste Einträge
let saveTimer = null;

function newObs(){
  return { id: uid(), created: Date.now(), updated: Date.now(),
    name:'', fach:'', klasse:'', raum:'', stunde:'', datum: today(), thema:'', nachbesprechung:'',
    timer:{elapsed:0, runStart:null},
    entries:[], checks:{}, notes:{}, sonstiges:'', photos:[], sketch:null, media:[], la:{}, laNote:'' };
}
function save(){
  if(!cur) return;
  cur.updated = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => DB.put(cur).catch(e => toast('Speichern fehlgeschlagen: ' + e.message)), 300);
}
function flush(){ if(cur){ clearTimeout(saveTimer); DB.put(cur); } }
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if(document.hidden) flush(); });

/* ================= Timer ================= */
function elapsed(){ const t = cur.timer; return t.elapsed + (t.runStart ? Date.now() - t.runStart : 0); }
function curMinute(){ const e = elapsed(); return (e === 0 && !cur.timer.runStart) ? '' : Math.floor(e/60000) + 1; }
function toggleTimer(){
  const t = cur.timer;
  if(t.runStart){ t.elapsed += Date.now() - t.runStart; t.runStart = null; }
  else t.runStart = Date.now();
  save(); renderTop();
  // Beim Starten/Fortsetzen direkt zum Verlauf wechseln
  if(t.runStart && tab !== 'verlauf'){ tab = 'verlauf'; renderTab(); window.scrollTo(0, 0); }
}
function resetTimer(){
  if(!confirm('Stoppuhr auf 0 zurücksetzen?')) return;
  cur.timer = {elapsed:0, runStart:null}; save(); renderTop();
}
setInterval(() => { if(cur) updateTimerDisplay(); }, 1000);
function updateTimerDisplay(){
  const el = $('#tval'); if(!el) return;
  const e = elapsed(), s = Math.floor(e/1000);
  el.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const m = curMinute();
  $('#tmin').textContent = m ? `Min. ${m}` : 'bereit';
  $('#timerBox').classList.toggle('over', s >= LESSON_MIN*60);
}

function countChecks(o){
  let p = 0, n = 0;
  for(const sec of RASTER) for(const g of sec.g) for(const it of g.i){
    const v = o.checks[itemKey(sec, g, it)];
    if(!v) continue;
    if(it.type === 'm'){ v.forEach(x => { if(it.pos.includes(x)) p++; else if(it.neg.includes(x)) n++; }); }
    else { const c = scaleClass(it.opts.indexOf(v), it.opts.length); if(c === 'pos') p++; else if(c === 'neg') n++; }
  }
  return {p, n};
}

/* ================= Skizze ================= */
let pen = {color:'#1c1c1a', eraser:false}, undoStack = [];
function initSketch(){
  const cv = $('#sk'), ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  if(cur.sketch){ const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0); im.src = cur.sketch; }
  undoStack = [];
  let drawing = false, last = null;
  const pt = e => { const r = cv.getBoundingClientRect(); return {x:(e.clientX - r.left) * cv.width / r.width, y:(e.clientY - r.top) * cv.height / r.height, p:e.pressure || .5}; };
  cv.addEventListener('pointerdown', e => {
    // Apple Pencil: nur Stift zeichnet, wenn Stift erkannt wurde (Handballen ignorieren)
    if(e.pointerType === 'touch' && initSketch.penSeen) return;
    if(e.pointerType === 'pen') initSketch.penSeen = true;
    cv.setPointerCapture(e.pointerId);
    undoStack.push(ctx.getImageData(0, 0, cv.width, cv.height)); if(undoStack.length > 20) undoStack.shift();
    drawing = true; last = pt(e);
  });
  cv.addEventListener('pointermove', e => {
    if(!drawing) return;
    const p = pt(e);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = pen.eraser ? '#fff' : pen.color;
    ctx.lineWidth = pen.eraser ? 40 : 2 + 5 * p.p;
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  const end = () => { if(!drawing) return; drawing = false; cur.sketch = isBlank(cv) ? null : cv.toDataURL('image/png'); save(); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}
function isBlank(cv){
  const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
  for(let i = 0; i < d.length; i += 16) if(d[i] < 250 || d[i + 1] < 250 || d[i + 2] < 250) return false;
  return true;
}

/* ================= Foto & Scan ================= */
// Was mit dem nächsten ausgewählten Bild passiert: tafel-photo | tafel-scan | media-photo | media-scan
let pickAction = null, pickMinute = '';
function startPick(action, fromLibrary){
  pickAction = action; pickMinute = curMinute();
  $(fromLibrary ? '#filePick' : '#filePhoto').click();
}
function loadImageFile(f, max){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bild konnte nicht geladen werden')); };
    im.src = url;
  });
}
function storeImage(action, src, minute){
  if(action.startsWith('tafel')) cur.photos.push(src);
  else cur.media.push({id:uid(), kind:action.endsWith('scan') ? 'scan' : 'photo', src, caption:'', min:minute, ts:Date.now()});
  save(); renderTab();
}
async function handlePicked(e){
  const files = [...e.target.files]; e.target.value = '';
  const action = pickAction, minute = pickMinute;
  if(!files.length || !action) return;
  try{
    if(action.endsWith('scan')){
      const src = await loadImageFile(files[0], 2400);
      openScanner(src, (data, next) => {
        storeImage(action, data, minute); toast('Scan gespeichert');
        if(next) startPick(action);
      });
    } else {
      for(const f of files){ const c = await loadImageFile(f, 1800); storeImage(action, c.toDataURL('image/jpeg', .78), minute); }
      toast(files.length > 1 ? `${files.length} Fotos gespeichert` : 'Foto gespeichert');
    }
  }catch(err){ alert(err.message); }
}
$('#filePhoto').addEventListener('change', handlePicked);
$('#filePick').addEventListener('change', handlePicked);

function laCount(o, items){
  const c = {ja:0, nein:0, nb:0}; items.forEach(it => { const v = (o.la || {})[it.id]; if(v) c[v]++; });
  c.offen = items.length - c.ja - c.nein - c.nb; return c;
}
function laSumHtml(items, neg){
  const c = laCount(cur, items);
  return `<span class="badge ${neg ? 'n' : 'p'}">${c.ja} ja</span><span class="badge ${neg ? 'p' : 'n'}">${c.nein} nein</span><span class="badge k">${c.nb} n. b.</span>${c.offen ? `<span class="muted" style="font-size:13px">${c.offen} offen</span>` : ''}`;
}
// Übersicht: Anteil „ja“ je Stufe
function laTopHtml(){
  const offen = laCount(cur, LA_ITEMS).offen;
  return LA_GROUPS.map(g => { const items = LA_ITEMS.filter(i => i.g === g.k && !LA_NEUTRAL.has(i.id)), c = laCount(cur, items);
    return `<span class="badge ${g.neg ? 'n' : 'k'}" title="ja / Aussagen">${g.k} ${c.ja}/${items.length}</span>`; }).join('')
    + (offen ? `<span class="muted" style="font-size:13px">${offen} offen</span>` : '');
}
function laChip(it, k, l){
  const cls = k === 'nb' ? 'neu' : it.id === 'MA2' ? 'neu' : (k === 'ja') !== it.neg ? 'pos' : 'neg';
  return `<button class="chip ${cls} ${cur.la[it.id] === k ? 'on' : ''}" data-la="${it.id}" data-v="${k}">${l}</button>`;
}

  </div>
  ${LA_GROUPS.map(g => { const items = LA_ITEMS.filter(i => i.g === g.k); return `<div class="card" style="margin-top:14px">
    <div class="sec-head" style="flex-wrap:wrap"><h2>${g.k}</h2><span class="row" style="gap:6px" data-lasum="${g.k}">${laSumHtml(items, g.neg)}</span></div>

/* ================= Scanner (Ecken, Perspektivkorrektur, Filter) ================= */
function detectQuad(src){

    wB += hist[t]; if(!wB) continue; const wF = N - wB; if(!wF) break;
    sumB += t * hist[t]; const mB = sumB / wB, mF = (sum - sumB) / wF, between = wB * wF * (mB - mF) ** 2;
    if(between > best){ best = between; th = t; }
  }
  // größte helle Fläche
  const lab = new Int32Array(N), stack = []; let bestLab = 0, bestSize = 0, n = 0;
  for(let i = 0; i < N; i++){
    if(g[i] <= th || lab[i]) continue;
    n++; let size = 0; lab[i] = n; stack.push(i);
    while(stack.length){
      const p = stack.pop(); size++; const px = p % w, py = p / w | 0;
      if(px > 0 && !lab[p-1] && g[p-1] > th){ lab[p-1] = n; stack.push(p-1); }
      if(px < w-1 && !lab[p+1] && g[p+1] > th){ lab[p+1] = n; stack.push(p+1); }
      if(py > 0 && !lab[p-w] && g[p-w] > th){ lab[p-w] = n; stack.push(p-w); }
      if(py < h-1 && !lab[p+w] && g[p+w] > th){ lab[p+w] = n; stack.push(p+w); }

}
function defaultQuad(src, m){ return [[m, m], [1-m, m], [1-m, 1-m], [m, 1-m]].map(([a, b]) => [a * src.width, b * src.height]); }
function homography(from, to){ // Abbildung to -> from (für Rückwärts-Sampling)
  const A = [], b = [];
  for(let i = 0; i < 4; i++){
    const [x, y] = to[i], [u, v] = from[i];
    A.push([x, y, 1, 0, 0, 0, -u*x, -u*y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v*x, -v*y]); b.push(v);
  }
  for(let c = 0; c < 8; c++){
    let p = c; for(let r = c + 1; r < 8; r++) if(Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];
    for(let r = 0; r < 8; r++){ if(r === c) continue; const f = A[r][c] / A[c][c]; for(let k = c; k < 8; k++) A[r][k] -= f * A[c][k]; b[r] -= f * b[c]; }

}
function warp(src, q){
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  let W = Math.max(dist(q[0], q[1]), dist(q[3], q[2])), H = Math.max(dist(q[0], q[3]), dist(q[1], q[2]));
  const k = Math.min(1, 2000 / Math.max(W, H)); W = Math.max(1, Math.round(W * k)); H = Math.max(1, Math.round(H * k));
  const h = homography(q, [[0, 0], [W, 0], [W, H], [0, H]]);
  const sw = src.width, sh = src.height, sd = src.getContext('2d').getImageData(0, 0, sw, sh).data;
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const octx = out.getContext('2d'), od = octx.createImageData(W, H), o = od.data;
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    const X = x + .5, Y = y + .5, den = h[6] * X + h[7] * Y + 1;
    let u = (h[0] * X + h[1] * Y + h[2]) / den - .5, v = (h[3] * X + h[4] * Y + h[5]) / den - .5;

    const x0 = u | 0, y0 = v | 0, fx = u - x0, fy = v - y0, i00 = (y0 * sw + x0) * 4, i01 = i00 + sw * 4, oi = (y * W + x) * 4;

function rotate90(c){
  const r = document.createElement('canvas'); r.width = c.height; r.height = c.width;

}
function applyFilter(c, mode){
  const W = c.width, H = c.height, out = document.createElement('canvas'); out.width = W; out.height = H;
  const ctx = out.getContext('2d'); ctx.drawImage(c, 0, 0);
  const img = ctx.getImageData(0, 0, W, H), d = img.data, N = W * H, g = new Float32Array(N);
  for(let i = 0; i < N; i++) g[i] = .299 * d[i*4] + .587 * d[i*4+1] + .114 * d[i*4+2];
  if(mode === 'doc'){
    // Hintergrund (Papier) über großen Box-Blur schätzen und herausrechnen -> weißes Papier, dunkle Schrift
    const r = Math.max(8, Math.round(Math.max(W, H) / 40)), W1 = W + 1, I = new Float64Array(W1 * (H + 1));
    for(let y = 0; y < H; y++){ let rs = 0; for(let x = 0; x < W; x++){ rs += g[y*W+x]; I[(y+1)*W1+x+1] = I[y*W1+x+1] + rs; } }
    for(let y = 0; y < H; y++){
      const y0 = Math.max(0, y - r), y1 = Math.min(H, y + r + 1);
      for(let x = 0; x < W; x++){
        const x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1);
        const bg = (I[y1*W1+x1] - I[y0*W1+x1] - I[y1*W1+x0] + I[y0*W1+x0]) / ((y1 - y0) * (x1 - x0));
        let n = (g[y*W+x] / Math.max(bg, 1) - .6) / .35; n = n < 0 ? 0 : n > 1 ? 1 : n;
        const v = 255 * n, i = (y*W+x) * 4; d[i] = d[i+1] = d[i+2] = v;
      }
    }
  } else {
    // Tonwertkorrektur (1 % / 99 %)
    const hist = new Array(256).fill(0); for(let i = 0; i < N; i++) hist[g[i] | 0]++;
    let lo = 0, hi = 255, acc = 0; for(; lo < 255; lo++){ acc += hist[lo]; if(acc > N * .01) break; }
    acc = 0; for(; hi > 0; hi--){ acc += hist[hi]; if(acc > N * .01) break; }
    const k = 255 / Math.max(1, hi - lo);
    for(let i = 0; i < N; i++){
      if(mode === 'gray'){ const v = (g[i] - lo) * k; d[i*4] = d[i*4+1] = d[i*4+2] = v; }
      else for(let c2 = 0; c2 < 3; c2++) d[i*4+c2] = (d[i*4+c2] - lo) * k;

}
function openScanner(src, onSave){
  let quad = detectQuad(src), step = 'corners', mode = 'doc', rot = 0, warped = null, result = null, drag = null, view = {s:1, ox:0, oy:0};
  const ov = document.createElement('div'); ov.className = 'scanner';
  ov.innerHTML = '<div class="sc-top"></div><div class="sc-stage"><canvas></canvas></div><div class="sc-bottom"></div>';
  document.body.appendChild(ov);
  const stage = ov.querySelector('.sc-stage'), cv = ov.querySelector('canvas');
  const compute = () => { let w = warped; for(let i = 0; i < rot; i++) w = rotate90(w); result = applyFilter(w, mode); };
  function bars(){
    ov.querySelector('.sc-top').innerHTML = step === 'corners'
      ? '<button class="btn" data-s="cancel">Abbrechen</button><div class="sc-title">Ecken anpassen</div><button class="btn primary" data-s="next">Weiter</button>'
      : '<button class="btn" data-s="back">‹ Ecken</button><div class="sc-title">Scan prüfen</div><button class="btn primary" data-s="save">Speichern</button>';
    ov.querySelector('.sc-bottom').innerHTML = step === 'corners'
      ? '<div class="sc-hint">Blaue Punkte auf die Ecken des Dokuments ziehen.</div><button class="btn" data-s="auto">Automatisch</button><button class="btn" data-s="full">Ganzes Bild</button>'
      : `${[['doc', 'Dokument'], ['gray', 'Graustufen'], ['color', 'Farbe']].map(([k, l]) => `<button class="chip ${mode === k ? 'on' : ''}" data-s="mode" data-m="${k}">${l}</button>`).join('')}
         <button class="btn" data-s="rot">⟳ Drehen</button><button class="btn" data-s="savenext">Speichern + nächste Seite</button>`;
  }
  function draw(){
    const r = stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, r.width, r.height);
    const img = step === 'corners' ? src : result, pad = 24;
    const s = Math.min((r.width - 2 * pad) / img.width, (r.height - 2 * pad) / img.height);
    const ox = (r.width - img.width * s) / 2, oy = (r.height - img.height * s) / 2;
    view = {s, ox, oy};
    ctx.drawImage(img, ox, oy, img.width * s, img.height * s);
    if(step !== 'corners') return;
    const P = quad.map(([x, y]) => [ox + x * s, oy + y * s]);
    const path = () => { ctx.moveTo(P[0][0], P[0][1]); for(let i = 1; i < 4; i++) ctx.lineTo(P[i][0], P[i][1]); ctx.closePath(); };
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.rect(0, 0, r.width, r.height); path(); ctx.fill('evenodd');
    ctx.strokeStyle = '#4da3ff'; ctx.lineWidth = 2; ctx.beginPath(); path(); ctx.stroke();
    P.forEach((p, i) => { ctx.beginPath(); ctx.arc(p[0], p[1], i === drag ? 17 : 13, 0, Math.PI * 2); ctx.fillStyle = 'rgba(77,163,255,.35)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke(); });
    if(drag !== null){ // Lupe, damit der Finger die Ecke nicht verdeckt
      const L = 140, z = 3, [qx, qy] = quad[drag], srcSize = L / (s * z);
      const lx = P[drag][0] < r.width / 2 ? r.width - L - 12 : 12, ly = 12;
      ctx.save(); ctx.beginPath(); ctx.rect(lx, ly, L, L); ctx.clip();
      ctx.fillStyle = '#000'; ctx.fillRect(lx, ly, L, L);
      ctx.drawImage(src, qx - srcSize / 2, qy - srcSize / 2, srcSize, srcSize, lx, ly, L, L);
      ctx.strokeStyle = '#4da3ff'; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.moveTo(lx + L / 2, ly); ctx.lineTo(lx + L / 2, ly + L); ctx.moveTo(lx, ly + L / 2); ctx.lineTo(lx + L, ly + L / 2); ctx.stroke();
      ctx.restore(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(lx, ly, L, L);
    }
  }
  const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => {
    if(step !== 'corners') return;
    const [x, y] = local(e); let best = null, bd = 50;
    quad.forEach(([qx, qy], i) => { const dd = Math.hypot(view.ox + qx * view.s - x, view.oy + qy * view.s - y); if(dd < bd){ bd = dd; best = i; } });
    if(best === null) return;
    drag = best; cv.setPointerCapture(e.pointerId); draw();
  });
  cv.addEventListener('pointermove', e => {
    if(drag === null) return;
    const [x, y] = local(e);
    quad[drag] = [Math.max(0, Math.min(src.width, (x - view.ox) / view.s)), Math.max(0, Math.min(src.height, (y - view.oy) / view.s))];

  window.addEventListener('resize', onResize);
  const close = () => { window.removeEventListener('resize', onResize); ov.remove(); };
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if(!b) return;
    switch(b.dataset.s){
      case 'cancel': close(); return;
      case 'auto': quad = detectQuad(src); break;
      case 'full': quad = defaultQuad(src, 0); break;
      case 'next': warped = warp(src, quad); compute(); step = 'preview'; bars(); break;
      case 'back': step = 'corners'; bars(); break;
      case 'mode': mode = b.dataset.m; compute(); bars(); break;
      case 'rot': rot = (rot + 1) % 4; compute(); break;
      case 'save': case 'savenext': {
        const data = result.toDataURL('image/jpeg', mode === 'color' ? .82 : .85);
        close(); onSave(data, b.dataset.s === 'savenext'); return;
      }
    }
    draw();
  });
  bars(); requestAnimationFrame(draw);
}

/* ================= Export ================= */
function fileBase(){ return `UB ${cur.datum || ''} ${cur.name || ''} ${cur.fach || ''}`.replace(/\s+/g, ' ').replace(/[\\/:*?"<>|]/g, '').trim(); }

function toMarkdown(o){
  const y = v => JSON.stringify(v || '');
  const L = [];
  L.push('---', 'typ: Unterrichtsbesuch', `lehrkraft: ${y(o.name)}`, `fach: ${y(o.fach)}`, `klasse: ${y(o.klasse)}`, `raum: ${y(o.raum)}`, `stunde: ${y(o.stunde)}`,
         `datum: ${o.datum || ''}`, `thema: ${y(o.thema)}`, `nachbesprechung: ${o.nachbesprechung || ''}`, 'tags: [unterrichtsbesuch]', '---', '');
  L.push(`# Unterrichtsbesuch ${o.name || ''} – ${o.fach || ''} ${o.klasse || ''}`.trim(), '');
  L.push(`**Thema:** ${o.thema || '–'}  `, `**Datum:** ${fmtDate(o.datum)}${o.stunde ? `, ${String(o.stunde).replace(/\.$/, '')}. Stunde` : ''}${o.raum ? `, Raum ${o.raum}` : ''}  `, `**Nachbesprechung:** ${fmtDate(o.nachbesprechung) || '–'}`, '');
  L.push('## Verlauf', '');
  if(o.entries.length){
    L.push('| Min. | Inhalt / Struktur | Sozialform / Methode |', '|---:|---|---|');
    [...o.entries].sort((a, b) => (+a.min || 999) - (+b.min || 999))
      .forEach(e => L.push(`| ${e.min || ''} | ${(e.text || '').replace(/\|/g, '\\|').replace(/\n/g, '<br>')} | ${(e.meths || []).join(', ')} |`));
  } else L.push('_keine Einträge_');
  L.push('', '## Beobachtungsraster', '');
  for(const sec of RASTER){
    const lines = [];
    for(const g of sec.g) for(const it of g.i){
      const v = o.checks[itemKey(sec, g, it)];
      if(!v || (Array.isArray(v) && !v.length)) continue;
      const lbl = (g.t ? g.t + ' – ' : '') + it.label;
      if(it.type === 'm'){
        const p = v.filter(x => it.pos.includes(x) && !isWarn(x)).map(clean);
        const w = v.filter(x => isWarn(x)).map(clean);
        const n = v.filter(x => it.neg.includes(x) && !isWarn(x)).map(clean);
        const u = v.filter(x => it.neu.includes(x));
        const parts = [p.length && '✅ ' + p.join(', '), w.length && '⚠️ ' + w.join(', '), n.length && '❌ ' + n.join(', '), u.length && u.join(', ')].filter(Boolean);
        lines.push(`- **${lbl}:** ${parts.join(' · ')}`);
      } else {
        const c = scaleClass(it.opts.indexOf(v), it.opts.length);
        lines.push(`- **${lbl}:** ${{pos:'✅', warn:'⚠️', neg:'❌'}[c]} ${v}`);
      }
    }
    if(o.notes[sec.s]) lines.push(`- _Anmerkung:_ ${o.notes[sec.s].replace(/\n/g, ' ')}`);
    if(lines.length) L.push(`### ${sec.s}`, '', ...lines, '');
  }
  const la = o.la || {};
  if(LA_ITEMS.some(it => la[it.id]) || o.laNote){
    const lbl = {ja:'✅ ja', nein:'❌ nein', nb:'– nicht beobachtet'};
    const lblNeg = {ja:'❌ ja (trifft zu)', nein:'✅ nein', nb:'– nicht beobachtet'};
    L.push(`## Leistungsanforderungen: ${LA_TITLE}`, '');
    LA_GROUPS.forEach(g => {
      const items = LA_ITEMS.filter(i => i.g === g.k), c = laCount(o, items);
      L.push(`### ${g.k} (${c.ja} ja · ${c.nein} nein · ${c.nb} n. b.)`, '', '| Aussage | Bewertung |', '|---|---|',
        ...items.map(it => `| ${it.t} | ${la[it.id] ? (it.neg ? lblNeg : lbl)[la[it.id]] : ''} |`), '');
    });
    if(o.laNote) L.push(`**Bemerkung:** ${o.laNote}`, '');
  }
  L.push('## Sonstiges', '', o.sonstiges || '_–_', '');
  const med = o.media || [];
  L.push('## Tafelbild', '', (o.photos.length || o.sketch) ? `${o.photos.length} Foto(s)${o.sketch ? ' + Skizze' : ''} – siehe PDF-Export.` : '_–_', '');
  L.push('## Medien', '', med.length ? med.map((m, i) => `${i + 1}. ${m.kind === 'scan' ? 'Scan' : 'Foto'}${m.min ? ` (Min. ${m.min})` : ''}${m.caption ? `: ${m.caption}` : ''}`).join('\n') + '\n\n_Bilder siehe PDF-Export._' : '_–_', '');
  return L.join('\n');
}

async function shareMarkdown(){
  const md = toMarkdown(cur), name = fileBase() + '.md';
  const file = new File([md], name, {type:'text/markdown'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(e){ if(e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();

}
async function copyMarkdown(){

}

      <td><span class="k">Klasse</span>${esc(o.klasse)}</td><td><span class="k">Raum</span>${esc(o.raum)}</td>
      <td><span class="k">Stunde</span>${esc(o.stunde)}</td><td><span class="k">Datum</span>${fmtDate(o.datum)}</td></tr>
      <tr><td colspan="6"><span class="k">Thema</span>${esc(o.thema)}</td></tr></table>`;
  const rsec = sec => `<div class="rsec"><h4>${esc(sec.s)}</h4>${sec.g.map(g => `${g.t ? `<div class="rgrp">${esc(g.t)}</div>` : ''}${g.i.map(it => {
    const v = o.checks[itemKey(sec, g, it)];
    let body;
    if(it.type === 'm'){
      const sel = v || [];
      if(it.neu.length){
        body = `<div class="rcols">${it.neu.map(x => `<div>${X(sel.includes(x), x)}</div>`).join('')}</div>`;
      } else {
        const n = Math.max(it.pos.length, it.neg.length); let r = '';
        for(let k = 0; k < n; k++) r += `<div>${it.pos[k] ? X(sel.includes(it.pos[k]), clean(it.pos[k])) : ''}</div><div>${it.neg[k] ? X(sel.includes(it.neg[k]), clean(it.neg[k])) : ''}</div>`;
        body = `<div class="rcols">${r}</div>`;
      }
    } else body = `<div class="rscale">${it.opts.map(x => X(v === x, x)).join('')}</div>`;
    return `<div class="ritem"><div class="l">${esc(it.label)}</div>${body}</div>`;
  }).join('')}`).join('')}${o.notes[sec.s] ? `<div class="rnote">Anmerkung: ${esc(o.notes[sec.s])}</div>` : ''}</div>`;
  const raster = `<div class="rcol">${RASTER.slice(0, 2).map(rsec).join('')}</div><div class="rcol">${RASTER.slice(2).map(rsec).join('')}</div>`;
  return `
  <section class="pp"><div class="ph">Feedbackbogen zum Unterrichtsbesuch</div>${kopf}
    <table class="vl"><thead><tr><th>Zeit</th><th>Inhalt/Struktur</th><th>Sozialform/Methode</th></tr></thead><tbody>
    ${es.length ? es.map(e => `<tr><td class="z">${esc(e.min)}</td><td>${esc(e.text).replace(/\n/g, '<br>')}</td><td class="s">${esc((e.meths || []).join(', '))}</td></tr>`).join('') : '<tr><td class="z"></td><td>–</td><td class="s"></td></tr>'}
    </tbody></table></section>
  <section class="pp"><div class="ph">Sonstiges</div><div class="box">${(o.sonstiges || '').split('\n').map(l => `<div class="bl">${esc(l)}</div>`).join('')}</div></section>
  <section class="pp"><div class="rgrid">${raster}</div></section>
  <section class="pp"><div class="ph">Leistungsanforderungen</div>
    <div style="font-weight:700;margin-bottom:2pt">${esc(LA_TITLE)}</div>
    <div style="font-size:8pt;color:#444;margin-bottom:6pt">Stufenbeschreibungen aus den Leistungsanforderungen für Lehrkräfte (Realschule), Stand 7. April 2021</div>
    <table class="vl la"><thead><tr><th>Aussage</th><th class="c">ja</th><th class="c">nein</th><th class="c">nicht beob.</th></tr></thead><tbody>
    ${LA_GROUPS.map(g => `<tr class="lag"><td colspan="4">${g.k}${g.neg ? ' <span style="font-weight:400">(Mängelbeschreibung: ja = trifft zu)</span>' : ''}</td></tr>` +
      LA_ITEMS.filter(i => i.g === g.k).map(it => `<tr><td>${esc(it.t)}</td>${['ja', 'nein', 'nb'].map(k => `<td class="c">${(o.la || {})[it.id] === k ? '☒' : '☐'}</td>`).join('')}</tr>`).join('')).join('')}
    </tbody></table>
    <div style="font-weight:700;margin:10pt 0 3pt">Bemerkung</div>
    <div class="box" style="min-height:60mm">${(o.laNote || '').split('\n').map(l => `<div class="bl">${esc(l)}</div>`).join('')}</div></section>
  <section class="pp"><div class="ph">Tafelbild</div>
    ${o.photos.map(p => `<img class="timg" src="${p}">`).join('')}${o.sketch ? `<img class="timg" src="${o.sketch}">` : ''}
    ${!o.photos.length && !o.sketch ? '<div class="box" style="min-height:200mm"></div>' : ''}
    <div class="nb">Nachbesprechung am: ${fmtDate(o.nachbesprechung) || '_____________________'}</div></section>
  ${(o.media || []).length ? `<section class="pp"><div class="ph">Anlagen</div>${o.media.map((m, i) => `<div class="mitem"><img class="${m.kind === 'scan' ? 'scan' : 'photo'}" src="${m.src}">
    <div class="mcap">${i + 1}. ${m.kind === 'scan' ? 'Scan' : 'Foto'}${m.min ? ` · Min. ${m.min}` : ''}${m.caption ? ` – ${esc(m.caption)}` : ''}</div></div>`).join('')}</section>` : ''}`;
}
function printPdf(){
  flush();
  $('#printArea').innerHTML = buildPrint(cur);
  const t = document.title; document.title = fileBase();
  const imgs = [...$('#printArea').querySelectorAll('img')];
  Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => {
    window.print();
    setTimeout(() => { document.title = t; }, 500);
  });
}

/* PDF direkt im Browser erzeugen (window.print() funktioniert in iOS-Home-Bildschirm-Apps nicht) */
function loadScript(src){
  return new Promise((res, rej) => {
    if(document.querySelector(`script[src="${src}"]`)) return res();
    const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('Laden fehlgeschlagen: ' + src));
    document.head.appendChild(sc);
  });
}
function modal(html){
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="card">${html}</div>`;
  document.body.appendChild(m); return m;
}
let pdfBusy = false;
async function makePdf(){
  if(pdfBusy) return; pdfBusy = true;
  flush();
  const wait = modal('<h2 style="margin:0">PDF wird erstellt…</h2><p class="muted" style="margin:0">Einen Moment bitte.</p>');
  const pa = $('#printArea');
  try{
    await Promise.all([loadScript('vendor/jspdf.umd.min.js'), loadScript('vendor/html2canvas.min.js')]);
    pa.innerHTML = buildPrint(cur); pa.classList.add('render');
    await Promise.all([...pa.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4', compress:true});
    const PXMM = 703 / 186, MARGIN = 12, PAGE_PX = Math.floor((297 - 2 * MARGIN) * PXMM), SCALE = 2;
    let first = true;
    for(const sec of pa.querySelectorAll('.pp')){
      const canvas = await window.html2canvas(sec, {scale:SCALE, backgroundColor:'#ffffff', logging:false, useCORS:true});
      const top0 = sec.getBoundingClientRect().top, H = sec.scrollHeight;
      // Elemente, die nicht zerschnitten werden sollen
      const blocks = [...sec.querySelectorAll('tr, .ritem, .rsec h4, .rgrp, .bl, .timg, .nb, .kopf, .ph, .mitem')]
        .map(el => { const r = el.getBoundingClientRect(); return [r.top - top0, r.bottom - top0]; });
      let y = 0;
      while(y < H - 2){
        let end = Math.min(y + PAGE_PX, H);
        if(end < H){
          let moved = true;
          while(moved){ moved = false; for(const [t, b] of blocks) if(t < end && b > end && t > y + 80){ end = t; moved = true; } }
        }
        const slice = document.createElement('canvas');
        slice.width = canvas.width; slice.height = Math.ceil((end - y) * SCALE);
        const sctx = slice.getContext('2d'); sctx.fillStyle = '#fff'; sctx.fillRect(0, 0, slice.width, slice.height);
        sctx.drawImage(canvas, 0, Math.floor(y * SCALE), canvas.width, slice.height, 0, 0, canvas.width, slice.height);
        if(!first) pdf.addPage(); first = false;
        pdf.addImage(slice.toDataURL('image/jpeg', .9), 'JPEG', MARGIN, MARGIN, 186, (end - y) / PXMM);
        y = end;
      }
    }
    const name = fileBase() + '.pdf';
    const file = new File([pdf.output('blob')], name, {type:'application/pdf'});
    wait.remove();
    // Teilen braucht einen frischen Tipp des Nutzers, daher eigener Knopf
    const m = modal(`<h2 style="margin:0">PDF ist fertig</h2><p class="muted" style="margin:0">${esc(name)}</p>
      <button class="btn primary" data-pdf="share">Teilen / In Dateien sichern</button>
      <button class="btn" data-pdf="open">Öffnen</button>
      <button class="btn ghost" data-pdf="close">Schließen</button>`);
    const url = URL.createObjectURL(file);
    m.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-pdf]'); if(!b && ev.target !== m) return;
      const act = b ? b.dataset.pdf : 'close';
      if(act === 'share'){
        try{
          if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); }
          else { const a = document.createElement('a'); a.href = url; a.download = name; a.click(); }
        }catch(e){ if(e.name !== 'AbortError') toast('Teilen fehlgeschlagen: ' + e.message); }
      }
      if(act === 'open') window.open(url, '_blank');
      if(act === 'close'){ m.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); }
    });
  }catch(e){
    wait.remove(); alert('PDF konnte nicht erstellt werden: ' + e.message);
  }finally{
    pa.classList.remove('render'); pa.innerHTML = ''; pdfBusy = false;
  }
}

async function exportBackup(){
  const data = JSON.stringify({app:'ub-app', version:1, exported:new Date().toISOString(), items:list}, null, 1);
  const name = `UB-Backup ${today()}.json`, file = new File([data], name, {type:'application/json'});
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; } }
  catch(e){ if(e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
}
$('#fileImport').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    const items = Array.isArray(d) ? d : d.items;
    if(!Array.isArray(items)) throw new Error('Unbekanntes Format');
    let n = 0;
    for(const o of items){ if(o && o.id){ await DB.put(Object.assign(newObs(), o)); n++; } }
    list = await DB.all(); renderList(); toast(`${n} Beobachtung(en) importiert`);
  }catch(err){ alert('Import fehlgeschlagen: ' + err.message); }
});

/* ================= Events ================= */
function autoGrow(t){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }
function autoGrowAll(){ document.querySelectorAll('.entry textarea').forEach(autoGrow); }
function openObs(o){ o.media = o.media || []; o.la = o.la || {}; o.laNote = o.laNote || ''; cur = o; tab = o.entries.length || o.name ? 'verlauf' : 'kopf'; currentMeths = []; renderEditor(); }

document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-open]');
  // Menüs schließen
  document.querySelectorAll('.menu.open').forEach(m => { if(!m.contains(e.target)) m.classList.remove('open'); });
  if(!t) return;
  if(t.dataset.open){ openObs(list.find(o => o.id === t.dataset.open)); return; }
  if(t.dataset.tab){ tab = t.dataset.tab; renderTab(); window.scrollTo(0, 0); return; }
  const a = t.dataset.a;
  if(a) t.closest('.menu')?.classList.remove('open');
  switch(a){
    case 'lmenu': case 'emenu': t.parentElement.classList.toggle('open'); return;
    case 'new': { const o = newObs(); list.push(o); await DB.put(o); openObs(o); return; }
    case 'back': flush(); list = await DB.all(); renderList(); return;
    case 'timer': toggleTimer(); return;
    case 'treset': resetTimer(); return;
    case 'pdf': makePdf(); return;
    case 'print': printPdf(); return;
    case 'mdshare': shareMarkdown(); return;
    case 'mdcopy': copyMarkdown(); return;
    case 'backup': exportBackup(); return;
    case 'import': $('#fileImport').click(); return;
    case 'delete':
      if(!confirm(`Beobachtung „${cur.name || 'ohne Namen'}“ endgültig löschen?`)) return;
      await DB.del(cur.id); list = list.filter(o => o.id !== cur.id); renderList(); toast('Gelöscht'); return;
    case 'edel': {
      const id = t.closest('.entry').dataset.eid;
      cur.entries = cur.entries.filter(x => x.id !== id); save(); renderTab(); return;
    }
    case 'stamp': {
      const ta = $('#sonst'), m = curMinute(), ins = `[${m ? m + '′' : new Date().toTimeString().slice(0, 5)}] `;
      const s = ta.selectionStart ?? ta.value.length;
      const pre = ta.value.slice(0, s), nl = pre && !pre.endsWith('\n') ? '\n' : '';
      ta.value = pre + nl + ins + ta.value.slice(ta.selectionEnd ?? s);
      cur.sonstiges = ta.value; save(); ta.focus(); ta.selectionStart = ta.selectionEnd = s + nl.length + ins.length; return;
    }
    case 'photo': startPick('tafel-photo'); return;
    case 'tscan': startPick('tafel-scan'); return;
    case 'larest': LA_ITEMS.forEach(it => { if(!cur.la[it.id]) cur.la[it.id] = 'nb'; }); save(); renderTab(); return;
    case 'mphoto': startPick('media-photo'); return;
    case 'mscan': startPick('media-scan'); return;
    case 'mpick': startPick('media-photo', true); return;
    case 'mdel': if(confirm('Löschen?')){ cur.media = cur.media.filter(x => x.id !== t.dataset.mid); save(); renderTab(); } return;
    case 'pdel': if(confirm('Foto löschen?')){ cur.photos.splice(+t.dataset.i, 1); save(); renderTab(); } return;
    case 'skundo': {
      const cv = $('#sk'), u = undoStack.pop(); if(!u) return;
      cv.getContext('2d').putImageData(u, 0, 0); cur.sketch = isBlank(cv) ? null : cv.toDataURL('image/png'); save(); return;
    }
    case 'skclear': {
      if(!confirm('Skizze leeren?')) return;
      const cv = $('#sk'), ctx = cv.getContext('2d');
      undoStack.push(ctx.getImageData(0, 0, cv.width, cv.height));
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); cur.sketch = null; save(); return;
    }
  }
  if(t.dataset.pen){
    document.querySelectorAll('[data-pen]').forEach(x => x.classList.remove('on')); t.classList.add('on');
    pen = t.dataset.pen === 'eraser' ? {color:pen.color, eraser:true} : {color:t.dataset.pen, eraser:false}; return;
  }
  if(t.dataset.la){
    const id = t.dataset.la, v = t.dataset.v, g = LA_ITEMS.find(i => i.id === id).g;
    if(cur.la[id] === v) delete cur.la[id]; else cur.la[id] = v;
    t.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.v === cur.la[id]));
    $('#laSum').innerHTML = laTopHtml();
    document.querySelector(`[data-lasum="${g}"]`).innerHTML = laSumHtml(LA_ITEMS.filter(i => i.g === g), LA_GROUPS.find(x => x.k === g).neg);
    save(); return;
  }
  if(t.dataset.ck){
    const [si, gi, ii] = t.dataset.ck.split('.').map(Number);
    const sec = RASTER[si], g = sec.g[gi], it = g.i[ii], key = itemKey(sec, g, it), o = t.dataset.o;
    if(it.type === 'm'){
      const s = new Set(cur.checks[key] || []); s.has(o) ? s.delete(o) : s.add(o);
      cur.checks[key] = [...s]; t.classList.toggle('on');
    } else {
      cur.checks[key] = cur.checks[key] === o ? null : o;
      t.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.o === cur.checks[key]));
    }
    if(!cur.checks[key] || (Array.isArray(cur.checks[key]) && !cur.checks[key].length)) delete cur.checks[key];
    save();
    const head = t.closest('.card').querySelector('.sec-head'), c = countSec(sec);
    head.innerHTML = `<h2>${esc(sec.s)}</h2>${c.p ? `<span class="badge p">${c.p} ✓</span>` : ''}${c.n ? `<span class="badge n">${c.n} ✗</span>` : ''}`;
    return;
  }
  if(t.dataset.cm){
    const m = t.dataset.cm; currentMeths = currentMeths.includes(m) ? currentMeths.filter(x => x !== m) : [...currentMeths, m];
    t.classList.toggle('on'); return;
  }
  if(t.dataset.em){
    const en = cur.entries.find(x => x.id === t.closest('.entry').dataset.eid), m = t.dataset.em;
    en.meths = (en.meths || []).includes(m) ? en.meths.filter(x => x !== m) : [...(en.meths || []), m];
    t.classList.toggle('on'); save(); return;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(!cur) return;
  if(t.dataset.bind){ cur[t.dataset.bind] = t.value; save(); if(['name', 'thema'].includes(t.dataset.bind)) { const tt = document.querySelector('.top .title'); if(tt) tt.innerHTML = `${esc(cur.name || 'Neue Beobachtung')}${cur.thema ? ` <span class="muted">· ${esc(cur.thema)}</span>` : ''}`; } return; }
  if(t.id === 'laNote'){ cur.laNote = t.value; save(); return; }
  if(t.dataset.mcap){ const m = cur.media.find(x => x.id === t.dataset.mcap); if(m){ m.caption = t.value; save(); } return; }
  if(t.dataset.note !== undefined){ cur.notes[t.dataset.note] = t.value; save(); return; }
  if(t.id === 'sonst'){ cur.sonstiges = t.value; save(); return; }
  if(t.dataset.e){
    const en = cur.entries.find(x => x.id === t.closest('.entry').dataset.eid);
    en[t.dataset.e] = t.dataset.e === 'min' ? (t.value === '' ? '' : +t.value) : t.value;
    if(t.tagName === 'TEXTAREA') autoGrow(t);
    save();
  }
});

document.addEventListener('submit', e => {
  if(e.target.id !== 'cform') return;
  e.preventDefault();
  const inp = $('#ctext'), txt = inp.value.trim();
  if(!txt && !currentMeths.length) return;
  cur.entries.push({id:uid(), min:curMinute(), text:txt, meths:[...currentMeths]});
  save(); inp.value = '';
  $('#body').innerHTML = viewVerlauf(); autoGrowAll();
  inp.focus();
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
});

/* ================= Start ================= */
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => {
  await DB.open();
  list = await DB.all();
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  renderList();
  if(!DB.db) toast('Achtung: Browser-Speicher nicht verfügbar – Daten gehen beim Schließen verloren');
})();
